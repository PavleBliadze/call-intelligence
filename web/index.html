<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call Intelligence</title>
    <!-- Pinned local React and Babel: no frontend network dependency or build step. -->
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Sans Georgian",
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        background: #0b0b0d;
        color: #f4f4f5;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      ::selection {
        background: #e11020;
        color: #fff;
      }
      button {
        font-family: inherit;
      }
      .theme-toggle {
        background: transparent;
        border: none;
        cursor: pointer;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: inherit;
        transition: background 0.15s;
      }
      .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
      }
      button:not(:disabled),
      summary {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      audio {
        color-scheme: dark;
      }
      a {
        overflow-wrap: anywhere;
      }
      .player-row {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .search-layout {
        max-width: 920px;
        margin: auto;
      }
      .page {
        max-width: 1100px;
        margin: auto;
        padding: 36px 24px 72px;
      }
      .nav-row {
        display: flex;
        gap: 6px;
        max-width: 1100px;
        margin: auto;
        padding: 14px 24px;
      }
      .recording-heading {
        flex-wrap: wrap;
      }
      @media (max-width: 650px) {
        .category-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .page {
          padding: 24px 14px;
        }
        .nav-row {
          padding: 12px 14px;
        }
        .nav-row > span {
          display: none;
        }
        .recording-heading > div:first-child {
          flex-basis: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" src="/static/console.jsx"></script>
  </body>
</html>
