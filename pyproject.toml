# Code style and lint settings. Check with:  ruff check .  &&  ruff format --check .

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Long lines are left only inside model prompts and messages, which read better unwrapped.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry-point scripts add the project root to sys.path before importing it.
"demo/*.py" = ["E402"]
"web/app.py" = ["E402"]
